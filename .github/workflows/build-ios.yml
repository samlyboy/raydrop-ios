name: Build RayDrop iOS IPA (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-15          # Xcode 16，支持 iOS 15+ 部署目标，自带 iphoneos SDK（arm64 真机）
    steps:
      - uses: actions/checkout@v4

      # 注入 Tailscale OAuth 配置：本文件被 gitignore，CI 从仓库 Secrets 生成同名文件。
      # 本地构建请保留仓库内的 RayDrop/Config.swift（已在 .gitignore 排除，不会入库）。
      - name: Inject Tailscale OAuth config (from secrets)
        run: |
          if [ ! -f RayDrop/Config.swift ]; then
            cat > RayDrop/Config.swift <<'EOF'
          import Foundation

          /// AUTO-GENERATED by CI from repository secrets (not committed to git).
          struct Config {
              static let TS_CLIENT_ID = "${{ secrets.RAYDROP_TS_CLIENT_ID }}"
              static let TS_CLIENT_SECRET = "${{ secrets.RAYDROP_TS_CLIENT_SECRET }}"
          }
          EOF
            echo "Config.swift generated from GitHub secrets"
          else
            echo "Config.swift already present (local build)"
          fi

      - name: Install XcodeGen & generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # 分享扩展单独构建成 .appex（主 app 的 archive 不会自动带上它）
      # 注意：xcodebuild 没有 -buildPath 选项，要用 SYMROOT 指定构建输出目录
      - name: Build share extension
        run: |
          xcodebuild -project RayDrop.xcodeproj -scheme RayDropShare \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build/ShareBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Build real-device arm64 archive (no Apple cert)
        run: |
          xcodebuild -project RayDrop.xcodeproj -scheme RayDrop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RayDrop.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive

      - name: Install ldid & fake-sign + package IPA
        run: |
          brew install ldid
          bash scripts/package-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: raydrop-ipa
          path: raydrop.ipa
